<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Humbel isolierter Testzugang</title><style>body{font:18px system-ui;background:#eff4fa;margin:8vh auto;max-width:540px;padding:24px}form{background:white;padding:32px;border-radius:16px}label,input,select,button{display:block;width:100%;box-sizing:border-box;margin:16px 0;padding:12px}button{background:#075ca8;color:white;border:0;border-radius:8px}</style><h1>Humbel Testversion</h1><p>Nur synthetische Daten. Keine Produktionsverbindung. Testdaten werden beim Neustart zurückgesetzt.</p><form><label>Testkonto<select name="account"><option value="employee">Mitarbeiter</option><option value="leader">Abteilungsleitung</option><option value="admin">Administration</option></select></label><label>Testpasswort<input name="password" type="password" autocomplete="current-password" required></label><button>Anmelden</button><p role="alert"></p></form><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});if(r.ok)location.reload();else document.querySelector('[role=alert]').textContent='Anmeldung nicht möglich. Testzugang prüfen.';};</script></html>
