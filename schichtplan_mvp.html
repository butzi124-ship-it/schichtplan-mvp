<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Humbel-App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/home-dashboard.css" />
    <link rel="stylesheet" href="./css/app-shell.css" />
    <link rel="stylesheet" href="./css/production-design.css" />
  </head>

  <body class="h-app bg-slate-100 text-slate-900 min-h-screen">
    <a href="#view" class="h-skip-link">Zum Inhalt</a>
    <div id="app-shell" class="max-w-7xl mx-auto p-4 space-y-4">
      <header
        class="h-app-header bg-white rounded-xl shadow p-4 flex flex-wrap items-center justify-between gap-3"
      >
        <div class="flex items-center gap-4">
          <img
            src="./img/humbel.png"
            alt="Humbel Gear Technology"
            class="h-14 w-auto object-contain"
          />
          <div>
            <h1 class="text-2xl font-bold">
              Humbel-App
            </h1>
            <p class="text-sm text-slate-500">Fertigung · Planung · Werkzeuge</p>
          </div>
        </div>

        <div id="sessionInfo" class="text-sm font-medium" role="status"></div>
        <button id="app-menu-toggle" class="h-menu-toggle" type="button" aria-controls="tabs" aria-expanded="true">Menü</button>
      </header>

      <section id="loginBox" class="h-login bg-white rounded-xl shadow p-4 space-y-4" aria-labelledby="login-heading">
        <div>
          <h2 id="login-heading" class="font-semibold text-lg">Anmeldung</h2>
          <p class="text-sm text-slate-500">
            Anmeldung über Supabase oder Test-Login.
          </p>
        </div>

        <div
          role="status"
          id="loginStatus"
          class="text-sm rounded border border-slate-200 bg-slate-50 p-3 text-slate-600"
        >
          Supabase wird geprüft ...
        </div>

        <div class="grid md:grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium mb-1" for="loginEmail"
              >E-Mail</label
            >
            <input
              id="loginEmail"
              type="email"
              class="w-full border rounded p-2"
              placeholder="name@firma.ch"
              autocomplete="username"
            />
          </div>

          <div>
            <label class="block text-sm font-medium mb-1" for="loginPassword"
              >Passwort</label
            >
            <input
              id="loginPassword"
              type="password"
              class="w-full border rounded p-2"
              placeholder="Passwort"
              autocomplete="current-password"
            />
          </div>
        </div>

        <div class="flex flex-wrap gap-2">
          <button
            type="button"
            class="px-3 py-2 rounded bg-slate-900 text-white"
            onclick="loginWithSupabase()"
          >
            Mit Supabase anmelden
          </button>

          <button
            type="button"
            class="px-3 py-2 rounded bg-slate-200"
            onclick="fillLogin('admin')"
          >
            Admin-Mail eintragen
          </button>

          <button
            type="button"
            class="px-3 py-2 rounded bg-slate-200"
            onclick="fillLogin('employee')"
          >
            Mitarbeiter-Mail eintragen
          </button>
        </div>

        <div class="h-login-test border-t pt-4">
          <p class="text-sm font-medium mb-2">Lokaler Test-Login</p>
          <div class="flex flex-wrap gap-2">
            <button
              class="px-3 py-2 rounded bg-slate-900 text-white"
              onclick="loginAs('admin')"
            >
              Mido/Admin
            </button>
            <button
              class="px-3 py-2 rounded bg-blue-700 text-white"
              onclick="loginAs('Lavdrim')"
            >
              Lavdrim (A)
            </button>
            <button
              class="px-3 py-2 rounded bg-blue-700 text-white"
              onclick="loginAs('Roger')"
            >
              Roger (B)
            </button>
            <button
              class="px-3 py-2 rounded bg-blue-700 text-white"
              onclick="loginAs('Dashmir')"
            >
              Dashmir (C)
            </button>
            <button
              class="px-3 py-2 rounded bg-emerald-700 text-white"
              onclick="loginAs('Thomas')"
            >
              Thomas (D)
            </button>
            <button
              class="px-3 py-2 rounded bg-emerald-700 text-white"
              onclick="loginAs('Musa')"
            >
              Musa (E)
            </button>
            <button
              class="px-3 py-2 rounded bg-emerald-700 text-white"
              onclick="loginAs('Ardian')"
            >
              Ardian (F)
            </button>
          </div>
        </div>
      </section>

      <nav id="tabs" class="hidden gap-2 flex-wrap" aria-label="Hauptnavigation"></nav>

      <main id="view" tabindex="-1"></main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      window.SUPABASE_URL = "https://itntnpzqzyjfdnjdshvm.supabase.co";
      window.SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_YpTSu2eW6mj6OeKhWiLsuQ_nZEjYSXR";
    </script>

    <!-- Deliberately off until schema/RLS review and isolated DB tests are approved. -->
    <script>window.HUMBEL_ARTICLE_MASTER_ENABLED = false;</script>
    <script>window.HUMBEL_OPERATIONS_ENABLED = false;</script>
    <script src="./js/vendor/JsBarcode.code128.min.js"></script>
    <script>window.HUMBEL_BA_ENTRY_ENABLED = false;</script>
    <script src="./js/ba-entry.js"></script>
    <script src="./js/operations.js"></script>
    <script>window.HUMBEL_MACHINE_READINESS_ENABLED = false;</script>
    <script>window.HUMBEL_FORECAST_ENABLED = false;</script>
    <script src="./js/forecast-ui.js"></script>
    <script>window.HUMBEL_OP_ROUTING_ENABLED = false;</script>
    <script src="./js/op-routing.js"></script>
    <script>window.HUMBEL_SETUP_TIMES_ENABLED = false;</script>
    <script src="./js/setup-times.js"></script>
    <script>window.HUMBEL_OP_QUANTITIES_ENABLED = false;</script>
    <script src="./js/op-quantities.js"></script>
    <script>window.HUMBEL_BA_LIFECYCLE_ENABLED = false;</script>
    <script src="./js/ba-lifecycle.js"></script>
    <script src="./js/machine-readiness.js"></script>
    <script src="./js/article-master.js"></script>
    <script>window.HUMBEL_CONTEXT_HELP_ENABLED = false;</script>
    <script src="./js/help-topics.js"></script>
    <script src="./js/context-help.js"></script>
    <script>window.HUMBEL_LEARNING_UI_ENABLED = false;</script>
    <link rel="stylesheet" href="./css/learning.css" />
    <script src="./js/learning.js"></script>
    <script src="./js/production-design.js"></script>
    <script src="./js/dashboard-home.js"></script>
    <script src="./schichtplan_mvp.js"></script>
    <script src="./js/app-shell.js"></script>
  </body>
</html>
