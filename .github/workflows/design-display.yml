name: Design display acceptance
on:
  pull_request:
    paths: ['schichtplan_mvp.*', 'js/**', 'css/**', 'tests/design*.spec.js', '.github/workflows/design-display.yml']
permissions:
  contents: read
jobs:
  display:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 12
    env:
      HOME: /root
      QA_ARTIFACT_DIR: artifacts/design-display
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Additional display and original design acceptance on all five projects
        run: npx playwright test tests/design-foundation.spec.js tests/design-display.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-display-${{ github.sha }}
          path: |
            playwright-report/
            test-results/functional/
            test-results/results.json
            artifacts/design-display/
          retention-days: 14
