name: QA and Release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  functional:
    name: Functional Browsers
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 20
    env:
      # GitHub mounts /github/home as pwuser; Firefox rejects it when the container runs as root.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:syntax
      - run: npm run test:agents
      - run: npm run test:e2e
      - name: Summarize actual results
        if: always()
        run: cat artifacts/functional/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/functional/
            artifacts/functional/
          retention-days: 14
  integrity:
    name: QA Integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:qa
      - run: npm run qa:check
      - name: Record real database coverage honestly
        run: |
          echo '## Real database tests: BLOCKED / NOT EXECUTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'Catalog inventory is not a restored database. Docker/local Supabase, authoritative migrations and isolated auth fixtures are required. No production write tests are permitted.' >> "$GITHUB_STEP_SUMMARY"
  visual:
    name: Visual Regression
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15
    env:
      HUMBEL_VISUAL_ENV: playwright-1.62.1-noble
      QA_ARTIFACT_DIR: artifacts/visual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:visual
      - name: Summarize actual visual results
        if: always()
        run: cat artifacts/visual/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-report-${{ github.sha }}
          path: |
            visual-report/
            test-results/visual/
            artifacts/visual/
          retention-days: 14
  quality-gate:
    name: Quality Gate
    if: always()
    needs: [functional, integrity, visual]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed unless every required job passed
        env:
          FUNCTIONAL: ${{ needs.functional.result }}
          INTEGRITY: ${{ needs.integrity.result }}
          VISUAL: ${{ needs.visual.result }}
          COMMIT: ${{ github.sha }}
        run: |
          echo "QA commit: $COMMIT" >> "$GITHUB_STEP_SUMMARY"
          test "$FUNCTIONAL" = success
          test "$INTEGRITY" = success
          test "$VISUAL" = success
  deploy:
    name: Deploy Tested Main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/stage-pages.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
