name: Initial Visual Baselines
on:
  push:
    branches: [codex/qa-0.5.17]
    paths: [.github/workflows/visual-baselines.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  initial-references:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15
    env:
      QA_ARTIFACT_DIR: artifacts/bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refuse to overwrite any existing references
        run: node -e "const fs=require('fs');if(fs.existsSync('tests/visual-snapshots')&&fs.readdirSync('tests/visual-snapshots',{recursive:true}).some(f=>f.endsWith('.png')))throw Error('References already exist; explicit design-change review is required.');"
      - run: npm ci --ignore-scripts
      - name: Generate initial references, never commit automatically
        run: npx playwright test -c playwright.visual.config.js --update-snapshots=missing
      - run: node scripts/baseline-metadata.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-visual-baselines
          path: |
            tests/visual-snapshots/
            artifacts/bootstrap/
          retention-days: 14
